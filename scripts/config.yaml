# ── 论文来源 ──
sources:
  # HuggingFace Daily Papers：自带社区点赞数 upvotes，天然按影响力排序
  huggingface: true
  # 至少要多少点赞才进候选池（过滤掉没人关注的）
  hf_min_upvotes: 5
  # HF 最多取多少篇（按点赞从高到低）
  hf_max_papers: 25

  # arXiv：补充 AI+生物方向（HF 上覆盖少）
  arxiv: true
  # arXiv 分类
  arxiv_categories:
    - cs.CL     # 计算语言学 / LLM
    - cs.LG     # 机器学习
    - cs.AI     # 人工智能
    - q-bio.GN  # 基因组
    - q-bio.BM  # 生物大分子
    - q-bio.QM  # 定量方法
  # arXiv 每个分类抓最近多少篇（各分类分别限量，不会被 HF 高赞挤掉）
  arxiv_max_per_cat: 15

# ── 你的兴趣（喂给 DeepSeek 打分用，直接写大白话）──
interests: |
  我关注这些方向的高影响力工作：
  1. 大语言模型（LLM）：新架构、训练方法、推理能力、Agent、多模态。
  2. 强化学习（RL）：尤其是用于 LLM 对齐、推理的 RL。
  3. AI + 生物：蛋白质结构与设计、基因组学、单细胞、药物发现、制药、RNA。
  优先选：提出新方法且有明显效果提升的、大机构或知名团队的、开创性的工作。
  不要：纯理论无实验的、增量灌水的、跟以上方向无关的。

# ── 选题打分 ──
# 评分标准（rubric）：DeepSeek 给每篇打 1-5 分，保留 >= score_threshold 的
rubric: |
  5 分：开创性/重大突破，很可能改变研究方向或被广泛跟进。
  4 分：提出新方法且有明显效果提升，值得读。
  3 分：有价值的增量工作。
  2 分：常规增量、工程调参，价值有限。
  1 分：灌水，或与我的三个方向无关。
  打分时综合考虑：与我兴趣的相关度、创新性和影响力、以及信号（HF 点赞高、
  中稿顶会、放出代码都是加分项）。

# 保留分数 >= 这个阈值的论文（想更严调高，想更全调低）
# 4 = 只留「值得读」及以上，配合 max_papers，保证一天能 10 分钟内扫完
score_threshold: 4
# 一天最多收多少篇（短评版；20 篇左右仍可较快扫完）
max_papers: 20
# 分组：DeepSeek 把每篇归到其中之一
groups:
  - LLM
  - RL
  - AI+生物
  - 其他

# ── 写中文摘要 ──
script:
  model: deepseek-chat
  # 短评风格：2～3 句，一眼能抓住「做了啥 / 为啥值得看」
  summary_prompt: |
    用中文写这篇论文的短评，总共 2～3 句话，写成一段，不要分段，全文字数控制在 120 字以内。
    读者只想快速扫热点，不是来读论文精读。
    必须直接写正文，不要开场白、客套话、markdown 标记、分点罗列、数学公式。

    第一句：它解决什么问题 / 提出什么新东西（一句话点题）。
    第二句：关键做法或结果里最值得记住的一点（可带一个关键数字）。
    可选第三句：一句话说明为什么今天值得看一眼（影响力、开源、新方向等）；没有就别硬写。

    宁可短、准，也不要铺垫背景、不要把方法讲透。
