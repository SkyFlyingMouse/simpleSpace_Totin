# ── 论文来源 ──
sources:
  # HuggingFace Daily Papers：自带社区点赞数 upvotes，天然按影响力排序
  huggingface: true
  # 至少要多少点赞才进候选池（过滤掉没人关注的）
  hf_min_upvotes: 5
  # HF 最多取多少篇（按点赞从高到低）
  hf_max_papers: 25

  # arXiv：补充 AI+生物方向（HF 上覆盖少）
  arxiv: true
  # arXiv 分类
  arxiv_categories:
    - cs.CL     # 计算语言学 / LLM
    - cs.LG     # 机器学习
    - cs.AI     # 人工智能
    - q-bio.GN  # 基因组
    - q-bio.BM  # 生物大分子
    - q-bio.QM  # 定量方法
  # arXiv 每个分类抓最近多少篇（各分类分别限量，不会被 HF 高赞挤掉）
  arxiv_max_per_cat: 15

# ── 你的兴趣（喂给 DeepSeek 打分用，直接写大白话）──
interests: |
  我关注这些方向的高影响力工作：
  1. 大语言模型（LLM）：新架构、训练方法、推理能力、Agent、多模态。
  2. 强化学习（RL）：尤其是用于 LLM 对齐、推理的 RL。
  3. AI + 生物：蛋白质结构与设计、基因组学、单细胞、药物发现、制药、RNA。
  优先选：提出新方法且有明显效果提升的、大机构或知名团队的、开创性的工作。
  不要：纯理论无实验的、增量灌水的、跟以上方向无关的。

# ── 选题打分 ──
# 评分标准（rubric）：DeepSeek 给每篇打 1-5 分，保留 >= score_threshold 的
rubric: |
  5 分：开创性/重大突破，很可能改变研究方向或被广泛跟进。
  4 分：提出新方法且有明显效果提升，值得读。
  3 分：有价值的增量工作。
  2 分：常规增量、工程调参，价值有限。
  1 分：灌水，或与我的三个方向无关。
  打分时综合考虑：与我兴趣的相关度、创新性和影响力、以及信号（HF 点赞高、
  中稿顶会、放出代码都是加分项）。

# 保留分数 >= 这个阈值的论文（想更严调高，想更全调低）
score_threshold: 3
# 一天最多收多少篇（安全上限，防止太多太慢太贵）
max_papers: 25
# 分组：DeepSeek 把每篇归到其中之一
groups:
  - LLM
  - RL
  - AI+生物
  - 其他

# ── 写中文摘要 ──
script:
  model: deepseek-chat
  # 摘要风格要求：分段、硬核、讲透机制
  summary_prompt: |
    请用中文深入解读这篇论文，写成 3 个自然段，段落之间必须用一个空行隔开，方便阅读。
    面向的读者懂一些 AI 基础、想真正搞懂技术细节，不是纯小白。
    用连贯的叙述，不要用 markdown 标记、不要分点罗列、不要念数学公式。
    直接从第一段正文开始写，不要任何开场白、客套话（例如“好的”“以下是”“我将按照要求”之类）。

    第一段（背景与问题）：这篇要解决什么真实问题，之前的方法卡在哪、为什么不行，把动机讲清楚。

    第二段（方法与关键洞察）：核心创新点具体是怎么设计的——关键模块、训练或推理方式、算法思路，
    要讲到「它到底怎么运作、凭什么比之前的方法更好」这一层，必要时点出关键技术名词并解释清楚，
    不要停留在「提出了一个新框架」这种表面描述。

    第三段（结果与意义）：在什么任务或数据上、和谁比、提升了多少（给出关键数字），
    再客观说说它的局限或还没解决的问题、以及对这个方向可能的影响。

    宁可多讲两句把机制说透，也不要泛泛而谈、空话套话。
